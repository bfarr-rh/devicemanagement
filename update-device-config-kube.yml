- name: Gather and local-save remote host facts
  hosts: srlinux
  gather_facts: false
  vars:
    repo_dir: "/runner/project/devicedata"
    version_prefix: "v1.0.0"
  tasks:
    - name: Test NETCONF connection
      ansible.netcommon.netconf_get:
        display: xml
      register: netconf_test
    - name: Show NETCONF response
      ansible.builtin.debug:
        var: netconf_test
    - name: Retrieve running configuration
      ansible.netcommon.netconf_get:
        source: running
        display: xml
      register: config
    - name: Save configuration
      ansible.builtin.copy:
        content: "{{ config.output }}"
        dest: "/tmp/{{ inventory_hostname }}-config.xml"
      delegate_to: localhost
    - name: Show configuration
      ansible.builtin.debug:
        msg: "{{ config.output }}"
    - name: Pull latest changes
      ansible.builtin.git:
        repo: "https://github.com/bfarr-rh/devicedata.git"
        version: main
        dest: "{{ repo_dir }}"
      delegate_to: localhost
    - name: Create configuration directory
      ansible.builtin.file:
        path: "{{ repo_dir }}/{{ group_names[0] }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
    - name: Save gathered facts to JSON files on the control node
      ansible.builtin.copy:
        content: "{{ ansible_facts | to_nice_json }}"
        dest:  "{{ repo_dir }}/{{ group_names[0] }}/{{ inventory_hostname }}/config.json"
        mode: '0644'
      delegate_to: localhost
    - name: Create configuration
      ansible.builtin.template:
        src: templates/localhost_facts_md.j2
        dest: "{{ repo_dir }}/{{ group_names[0] }}/{{ inventory_hostname }}/{{ inventory_hostname }}_facts.md"
      delegate_to: localhost
    - name: Generate table of contents
      ansible.builtin.template:
        src: templates/toc_md.j2
        dest: "{{ repo_dir }}/README.md"
      delegate_to: localhost
    - name: Configure Git credentials
      ansible.builtin.shell: |
        git config credential.helper store
        printf "protocol=https\nhost=github.com\nusername={{ git_username }}\npassword={{ git_token }}\n" | git credential approve
      args:
        chdir: "{{ repo_dir }}"
      delegate_to: localhost
    - name: Configure Git credentials
      ansible.builtin.shell: |
        git remote set-url origin https://{{ git_username }}:{{ git_token }}@://github.com/devicedata.git
      args:
        chdir: "{{ repo_dir }}"
      delegate_to: localhost
    - name: Configure Git credentials name
      ansible.builtin.shell: |
        git config user.name {{ git_username }}
        git config user.email "ansible@example.com"
      args:
        chdir: "{{ repo_dir }}"
      delegate_to: localhost
    - name: Git add
      ansible.builtin.command:
        cmd: git add .
        chdir: "{{ repo_dir }}"
      delegate_to: localhost
    - name: Git commit
      ansible.builtin.command:
        cmd: git commit -m "Update files from Ansible"
        chdir: "{{ repo_dir }}"
      register: git_commit
      failed_when:
      - git_commit.rc != 0
      - "'nothing to commit' not in git_commit.stdout"
      delegate_to: localhost
    - name: Git push
      ansible.builtin.command:
        cmd: git push https://{{ git_username }}:{{ git_token }}@github.com/bfarr-rh/devicedata.git main
        chdir: "{{ repo_dir }}"
      when: git_commit.rc == 0
      delegate_to: localhost
    - name: Generate timestamp and create the git tag
      ansible.builtin.command:
        cmd: "git tag {{ version_prefix }}-{{ ansible_date_time.iso8601_basic_short }}"
        chdir: "{{ repo_dir }}"
      changed_when: true
      delegate_to: localhost
    - name: Push the timestamped tag to origin
      ansible.builtin.command:
        cmd: "git push https://{{ git_username }}:{{ git_token }}@github.com/bfarr-rh/devicedata.git {{ version_prefix }}-{{ ansible_date_time.iso8601_basic_short }}"
        chdir: "{{ repo_dir }}"
      changed_when: true
      delegate_to: localhost
