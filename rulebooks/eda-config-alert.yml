---
- name: Listen for Configuration Alerts from Kafka
  hosts: all
  sources:
    - name: Get messages from Kafka
      ansible.eda.kafka:
        host: kafka-kafka-bootstrap.kafka.svc.cluster.local
        port: 9092
        topic: config-alerts
        group_id: eda-consumer-group
  rules:
    - name: Debug print all raw events
      condition: event.payload.message is defined
      action:
        debug:
          msg: "{{ event.payload.message }}"  # <-- Natively exposes the entire structured payload
