---
- name: Listen for Configuration Alerts from Kafka
  hosts: all
  sources:
    - name: Get messages from Kafka
      ansible.eda.kafka:
        host: kafka-kafka-bootstrap.kafka.svc.cluster.local
        port: 9092
        topic: config-alerts
        group_id: eda-consumer-group
  rules:
    - name: Critical Event
      condition: event.body.event is search("CRITICAL")
      action:
        print_event:
          pretty: true
