---
- name: Listen for Configuration Alerts from Kafka
  hosts: all
  sources:
    - ansible.eda.url_check:
        # Calls the Kafka Bridge consumer endpoint
        urls:
          - "http://kafka-bridge-kafka.apps.sno.int.apac-tech-lab.net/topics/config-alerts"
        interval: 5  # Polls every 5 seconds
        method: GET
        headers:
          Accept: "application/vnd.kafka.json.v2+json"
  rules:
    - name: Debug and trigger remediation when baseline fails
      condition: event.value is defined
      actions:
        # 1. Print the incoming event data payload to the EDA logs
        - debug:
            msg: "Alert received for host {{ event.value.host }}. Reason: {{ event.value.event }}"
