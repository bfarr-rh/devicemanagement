version: 3
options:
  package_manager_path: /usr/bin/microdnf
images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest
dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  python_interpreter:
    package_system: "python312"
    python_path: /usr/bin/python3.12
additional_build_steps:
  prepend_base:
    - RUN microdnf install -y gcc python3.12 python3.12-devel systemd-devel && microdnf clean all
    - RUN whoami
    - RUN cat /etc/os-release
  append_final:
    - RUN pip3 freeze | grep -i ansible
    - RUN ansible-galaxy collection list
