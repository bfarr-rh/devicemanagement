---
- name: Dynamically extract the target field value
  ansible.builtin.set_fact:
    extracted_value: >-
      {% set ns = namespace(current=config_xml_dict) %}
      {% for key in compliance_rules.rules[0].path_string.split('.') %}
        {% if ns.current is mapping and key in ns.current %}
          {% set ns.current = ns.current[key] %}
        {% else %}
          {% set ns.current = none %}
        {% endif %}
      {% endfor %}
      {{ ns.current }}
  when: compliance_rules is defined
- name: Attempt to evaluate compliance
  block:
    - name: Set compliant fact if key matches exactly
      ansible.builtin.set_fact:
        auth_status: "{{ 'COMPLIANT' if extracted_value | string | trim == compliance_rules.rules[0].expected_value else 'NON-COMPLIANT' }}"
  rescue:
    - name: Handle missing keys or bad dictionary structures
      ansible.builtin.set_fact:
        auth_status: "NON-COMPLIANT (Missing configuration paths)"
  when: compliance_rules is defined
- name: Debug the parsed dictionary output
  ansible.builtin.debug:
    var: auth_status
  when: compliance_rules is defined
